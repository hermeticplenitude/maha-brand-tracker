<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>MAHA War Room — restricted</title>
<link rel="stylesheet" href="../styles.css">
<style>
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper,#f6f3ec);margin:0}
  .gate{background:#fff;border:1px solid var(--rule,#e2ddd2);border-radius:14px;box-shadow:0 10px 30px rgba(20,20,20,.08);padding:32px 30px;width:min(380px,92vw)}
  .gate .mark{display:inline-flex;width:38px;height:38px;border-radius:8px;background:#1f2a37;color:#fff;align-items:center;justify-content:center;font-family:Georgia,serif;font-weight:700;font-size:20px}
  .gate h1{font-family:Georgia,serif;font-size:1.5rem;margin:14px 0 4px;color:#1f2a37}
  .gate p{margin:0 0 18px;color:#5b6472;font-size:.9rem;line-height:1.45}
  .gate label{display:block;font-size:.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#5b6472;margin-bottom:6px}
  .gate input{width:100%;box-sizing:border-box;padding:11px 12px;font-size:1rem;border:1px solid #cfc8ba;border-radius:8px}
  .gate input:focus{outline:2px solid #1d6b6b;outline-offset:1px}
  .gate button{margin-top:14px;width:100%;padding:11px;border:0;border-radius:8px;background:#1f2a37;color:#fff;font-size:.95rem;font-weight:700;cursor:pointer}
  .gate button[disabled]{opacity:.6;cursor:wait}
  .gate .err{color:#9b1c2c;font-size:.85rem;min-height:1.2em;margin-top:10px}
  .gate .back{display:block;margin-top:16px;font-size:.82rem;color:#1d6b6b}
</style>
</head>
<body>
<form class="gate" id="gate" autocomplete="off">
  <span class="mark">M</span>
  <h1>MAHA War Room</h1>
  <p>This page is restricted. Enter the password to continue.</p>
  <label for="pw">Password</label>
  <input id="pw" type="password" autofocus required>
  <button id="go" type="submit">Unlock</button>
  <div class="err" id="err" role="alert"></div>
  <a class="back" href="../">← Back to the public MAHA Brand Tracker</a>
</form>
<script>
(() => {
  const b = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decryptText(url, pw) {
    const e = await fetch(url, {cache: 'no-store'}).then(r => r.json());
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const k = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b(e.salt), iterations: e.iter, hash: 'SHA-256'}, base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: b(e.iv)}, k, b(e.ct)));
  }
  async function unlock(pw, silent) {
    const btn = document.getElementById('go'), err = document.getElementById('err');
    btn.disabled = true; btn.textContent = 'Unlocking…'; err.textContent = '';
    try {
      const html = await decryptText('page.enc.json', pw);
      sessionStorage.setItem('wr_pw', pw);
      document.open(); document.write(html); document.close();
    } catch (x) {
      sessionStorage.removeItem('wr_pw');
      btn.disabled = false; btn.textContent = 'Unlock';
      if (!silent) err.textContent = 'Incorrect password.';
    }
  }
  document.getElementById('gate').addEventListener('submit', ev => { ev.preventDefault(); unlock(document.getElementById('pw').value, false); });
  const saved = sessionStorage.getItem('wr_pw'); if (saved) unlock(saved, true);
})();
</script>
</body>
</html>
